name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project (if zip is present)
        run: |
          set -e
          echo "=== Repo contents ==="
          ls -la
          ZIP=$(ls DualAudio*.zip 2>/dev/null | head -1 || true)
          if [ -n "$ZIP" ]; then
            echo "Extracting $ZIP ..."
            unzip -o "$ZIP"
            for d in DualAudioRouter DualAudioRouter_clean DualAudioRouter_fixed DualAudioRouter_final DualAudioRouter_v2 DualAudioRouter_v3; do
              if [ -d "$d" ]; then
                cp -a "$d"/. .
                rm -rf "$d"
              fi
            done
            rm -f "$ZIP"
            echo "=== After extract ==="
            ls -la
          else
            echo "No zip found – assuming project files are already at root"
          fi
          test -f settings.gradle.kts || { echo "ERROR: settings.gradle.kts missing"; exit 1; }
          test -d app || { echo "ERROR: app/ missing"; exit 1; }
          test -f app/build.gradle.kts || { echo "ERROR: app/build.gradle.kts missing"; exit 1; }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK path
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          if [ -d /usr/local/lib/android/sdk/cmdline-tools/latest/bin ]; then
            echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          elif [ -d /usr/local/lib/android/sdk/cmdline-tools/bin ]; then
            echo "/usr/local/lib/android/sdk/cmdline-tools/bin" >> $GITHUB_PATH
          else
            CT=$(find /usr/local/lib/android/sdk/cmdline-tools -type d -name bin 2>/dev/null | head -1)
            if [ -n "$CT" ]; then
              echo "$CT" >> $GITHUB_PATH
            fi
          fi
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH

      - name: Install required Android SDK packages
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          which sdkmanager || echo "sdkmanager still not found"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Install Gradle 8.2
        run: |
          set -e
          curl -fsSL https://services.gradle.org/distributions/gradle-8.2-bin.zip -o /tmp/gradle-8.2-bin.zip
          unzip -q /tmp/gradle-8.2-bin.zip -d /opt
          echo "/opt/gradle-8.2/bin" >> $GITHUB_PATH
          /opt/gradle-8.2/bin/gradle --version

      - name: Build Debug APK
        run: |
          set -e
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log
          echo "=== Looking for APK ==="
          find app/build/outputs -name "*.apk" -ls || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DualAudioRouter-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
